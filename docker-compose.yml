# Stream processing pipeline: Producer → Redpanda → Consumer → MongoDB
# Run with: docker-compose up --build



services:

  # Redpanda: Kafka-compatible message broker
  # Lightweight single-node setup for local development
  redpanda:
    image: redpandadata/redpanda:v23.3.11
    container_name: redpanda
    command:
      - redpanda start
      - --smp 1                    # Use 1 CPU core
      - --memory 512M              # Limit memory usage
      - --reserve-memory 0M
      - --overprovisioned          # Optimize for local/dev environment
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"

  # MongoDB: stores incoming sensor measurements
  # Flexible schema allows future sensors to add new fields
  mongodb:
    image: mongo:6.0.14
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: sensordata
    volumes:
      - mongodb_data:/data/db

  # Producer: fetches weather data from Open-Meteo API and publishes to Redpanda
  # Health events (timeouts, API errors) are also forwarded to the topic
  producer:
    build:
      context: .
      dockerfile: Dockerfile.producer
    container_name: producer
    restart: unless-stopped
    depends_on:
      - redpanda
    environment:
      - KAFKA_BROKER=redpanda:9092

  # Consumer: reads messages from Redpanda and stores them in MongoDB
  consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    container_name: consumer
    restart: unless-stopped
    depends_on:
      - redpanda
      - mongodb
    environment:
      - KAFKA_BROKER=redpanda:9092
      - MONGO_URI=mongodb://mongodb:27017/

volumes:
  mongodb_data: