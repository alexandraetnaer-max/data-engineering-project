# =============================================================================
# DOCKER COMPOSE FILE
# Purpose: Defines and orchestrates all containers for the stream processing
#          pipeline. Run with: docker-compose up --build
# =============================================================================

version: '3.8'

services:

  # ---------------------------------------------------------------------------
  # REDPANDA - Kafka-compatible message broker
  # Receives data from producer and distributes it to consumer
  # Lightweight alternative to Apache Kafka
  # ---------------------------------------------------------------------------
  redpanda:
    image: redpandadata/redpanda:latest
    container_name: redpanda
    command:
      - redpanda start
      - --smp 1                    # Use 1 CPU core (resource saving)
      - --memory 512M              # Limit memory to 512MB
      - --reserve-memory 0M        # No reserved memory
      - --overprovisioned          # Optimize for local development
      - --node-id 0                # Single node setup
      - --kafka-addr PLAINTEXT://0.0.0.0:9092       # Listen on all interfaces
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092  # Advertise address
    ports:
      - "9092:9092"  # Kafka API port

  # ---------------------------------------------------------------------------
  # MONGODB - NoSQL database for storing sensor measurements
  # Chosen for flexible schema - future sensors can add new fields easily
  # ---------------------------------------------------------------------------
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    ports:
      - "27017:27017"  # MongoDB default port
    environment:
      MONGO_INITDB_DATABASE: sensordata  # Create database on startup
    volumes:
      - mongodb_data:/data/db  # Persist data on local disk

  # ---------------------------------------------------------------------------
  # PRODUCER - Fetches data from Open-Meteo API and sends to Redpanda
  # Includes health monitoring: logs errors if API is unavailable
  # ---------------------------------------------------------------------------
  producer:
    build:
      context: .
      dockerfile: Dockerfile.producer  # Build from Dockerfile.producer
    container_name: producer
    restart: unless-stopped    # Auto-restart if container crashes
    depends_on:
      - redpanda   # Wait for Redpanda to start first
    environment:
      - KAFKA_BROKER=redpanda:9092  # Redpanda connection address

  # ---------------------------------------------------------------------------
  # CONSUMER - Reads messages from Redpanda and stores in MongoDB
  # Logs health warnings if error messages are received from producer
  # ---------------------------------------------------------------------------
  consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer  # Build from Dockerfile.consumer
    container_name: consumer
    restart: unless-stopped    # Auto-restart if container crashes
    depends_on:
      - redpanda   # Wait for Redpanda to start first
      - mongodb    # Wait for MongoDB to start first
    environment:
      - KAFKA_BROKER=redpanda:9092          # Redpanda connection address
      - MONGO_URI=mongodb://mongodb:27017/  # MongoDB connection address

# =============================================================================
# VOLUMES
# Named volumes for persistent data storage
# Data survives container restarts and updates
# =============================================================================
volumes:
  mongodb_data:  # Stores all MongoDB sensor measurements permanently